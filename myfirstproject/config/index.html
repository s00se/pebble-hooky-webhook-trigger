<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Pebble Webhook Config</title>
<style>
body { font-family: sans-serif; padding: 20px; }
input { width: 100%; padding: 8px; margin: 10px 0; }
button { padding: 10px 15px; }
</style>
</head>
<body>
  <h1>Webhook konfigurieren</h1>
  <input type="text" id="url" placeholder="https://example.com/webhook">
  <button id="save">Speichern</button>

  <script>
  document.getElementById('save').addEventListener('click', function() {
    var url = document.getElementById('url').value;
    var data = encodeURIComponent(JSON.stringify({ webhookUrl: url }));
    document.location = 'pebblejs://close#' + data;
  });
  </script>
</body>
</html>
